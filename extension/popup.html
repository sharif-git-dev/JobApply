<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobApply Autofill</title>
    <style>
      :root {
        --bg: #f5f4ef;
        --surface: #fff;
        --line: #e2dfd5;
        --ink: #1a1d1c;
        --muted: #62676a;
        --accent: #1d5c4c;
        --on-accent: #fff;
        --danger: #b3261e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111413;
          --surface: #1a1e1c;
          --line: #2b312e;
          --ink: #eceeec;
          --muted: #9aa29e;
          --accent: #6fd0ae;
          --on-accent: #0b1511;
          --danger: #f1958e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      select,
      input {
        width: 100%;
        height: 34px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      button {
        width: 100%;
        height: 36px;
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin: 10px 0 0;
        font-size: 12.5px;
        color: var(--muted);
        white-space: pre-wrap;
      }
      #status.error {
        color: var(--danger);
      }
      details {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>JobApply Autofill</h1>
    <label for="application">Applying to</label>
    <select id="application">
      <option value="">Profile details only</option>
    </select>
    <button id="fill" class="primary" disabled>Fill this page</button>
    <button id="copy" disabled>Copy cover letter</button>
    <p id="status" role="status">Connecting to JobApply…</p>
    <details>
      <summary>Connection</summary>
      <label for="base">JobApply address</label>
      <input id="base" spellcheck="false" />
    </details>
    <script src="popup.js"></script>
  </body>
</html>
